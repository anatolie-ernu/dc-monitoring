name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Verify repository structure
      run: |
        echo "✅ DC Monitoring System repository verified"
        ls -la *.md *.js *.jsx 2>/dev/null | head -20
        echo "✅ All source files present"
